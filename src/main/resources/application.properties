spring.application.name=authentication-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/auth/changelog-master.yaml

auth.bcrypt-strength=${AUTH_BCRYPT_STRENGTH:12}
auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.issuer=${AUTH_JWT_ISSUER:bankingApp}
auth.jwt.access-ttl=${AUTH_ACCESS_TTL:15m}
auth.jwt.refresh-ttl=${AUTH_REFRESH_TTL:7d}
auth.bootstrap-admin.enabled=${AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
auth.bootstrap-admin.user-id=${AUTH_BOOTSTRAP_ADMIN_USER_ID:0}
auth.bootstrap-admin.login=${AUTH_BOOTSTRAP_ADMIN_LOGIN:}
auth.bootstrap-admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
services.users.url=${USER_SERVICE_URL:http://localhost:8081}
services.users.password=${AUTH_SERVICE_INTERNAL_PASSWORD}
